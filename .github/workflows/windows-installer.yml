name: Windows installer

# Every push: run the tests, build JARVIS-Setup.exe, install it on a real
# Windows machine and run the self-test there. When all of that passes, the
# installer is published as the "latest-windows-build" pre-release, so there is
# always one stable download link:
#   https://github.com/<owner>/<repo>/releases/tag/latest-windows-build

on:
  push:
    branches: ["main", "master", "claude/**"]
    paths-ignore: ["**.md", "installer/README-FIRST.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: System libraries (Qt, PortAudio, espeak, X)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libportaudio2 espeak-ng xvfb xauth python3-tk
      - name: Python packages
        run: pip install -r tests/requirements.txt
      - name: Unit and end-to-end tests
        run: xvfb-run -a python -m pytest -q tests
      - name: Self-test (Linux)
        run: xvfb-run -a python main.py --selftest

  build:
    name: Build installer
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools (NSIS, MinGW, uv)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          pip install uv
      - name: Build
        run: python installer/build_windows.py --version 57.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup
          path: installer/dist/*.exe
          retention-days: 30
          compression-level: 0

  windows-test:
    name: Install + self-test on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-Setup
      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Filter "JARVIS-Setup-*.exe" | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "JARVIS"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$target\JARVIS.exe")) { throw "JARVIS.exe missing after install" }
          if (-not (Test-Path "$target\python\pythonw.exe")) { throw "bundled Python missing" }
          "Installed size: {0:N0} MB" -f ((Get-ChildItem $target -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Self-test
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "JARVIS"
          & "$target\JARVIS-Console.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed ($LASTEXITCODE)" }
      - name: Start the app for 25 seconds (must not crash)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "JARVIS"
          $p = Start-Process -FilePath "$target\python\python.exe" -ArgumentList "-X", "utf8", "`"$target\app\main.py`"" `
               -WorkingDirectory "$target\app" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\run.out" `
               -RedirectStandardError "$env:RUNNER_TEMP\run.err"
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Get-Content "$env:RUNNER_TEMP\run.out", "$env:RUNNER_TEMP\run.err" -ErrorAction SilentlyContinue
            throw "the app exited early with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:RUNNER_TEMP\run.out" -Tail 30 -ErrorAction SilentlyContinue
      - name: Uninstall (keeps nothing)
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "JARVIS"
          if (Test-Path "$target\Uninstall.exe") { Start-Process "$target\Uninstall.exe" -ArgumentList "/S" -Wait }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest-log
          path: |
            ${{ runner.temp }}/JARVIS/app/logs/
            ${{ runner.temp }}/run.out
            ${{ runner.temp }}/run.err
          if-no-files-found: ignore

  publish:
    name: Publish download
    needs: [build, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-Setup
      - name: Update the latest-windows-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls JARVIS-Setup-*.exe | head -n1)
          cat > notes.md <<EOF
          **JARVIS Mark LVI — Windows 10/11 installer** (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}, branch ${GITHUB_REF_NAME})

          1. Download **${FILE}** below and run it (no administrator rights needed).
             Windows SmartScreen may say "unrecognised app": click *More info* → *Run anyway* (the installer is not code-signed).
          2. For free local AI install [Ollama](https://ollama.com/download/windows), then pick *Ollama* on JARVIS's first screen.
          3. Start menu → JARVIS → *Quick-start guide* explains the rest.

          Installed and self-tested on a clean Windows runner before publishing.
          EOF
          gh release delete latest-windows-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-windows-build "$FILE" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "JARVIS for Windows — latest build (${{ github.run_number }})" --notes-file notes.md
